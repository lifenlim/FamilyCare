name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 0 * * *'   # runs once a day
  workflow_dispatch: {}    # allows manual "Run workflow" from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        # A table query (even one RLS rejects) reaches Postgres and counts as
        # real activity, unlike the bare /rest/v1/ discovery route, which this
        # project's API key format gets rejected for at the gateway.
        run: |
          curl -s -o /dev/null -w "status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/care_circles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
