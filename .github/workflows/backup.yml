name: Weekly Backup
on:
  schedule:
    - cron: '0 3 * * 0'   # once a week
  workflow_dispatch: {}    # allows manual "Run workflow" from the Actions tab
jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17
    steps:
      - name: Export database
        run: pg_dump "${{ secrets.SUPABASE_DB_URL }}" > backup-$(date +%F).sql
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 90
